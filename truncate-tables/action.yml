name: "Truncate tables (scaffold)"
description: "Truncates an explicit, reviewed allowlist of DB tables (mysql/postgres) with FK/trigger safety checks, dry-run support, and Slack alerting. Scaffold only - see README before enabling against prod."
inputs:
  db_engine:
    description: "Database engine: mysql or postgres"
    required: true
  db_host:
    description: "Database host"
    required: true
  db_port:
    description: "Database port"
    required: true
  db_name:
    description: "Database/schema name"
    required: true
  db_username:
    description: "Database username (pass via secrets in the caller workflow)"
    required: true
  db_password:
    description: "Database password (pass via secrets in the caller workflow)"
    required: true
  config_path:
    description: "Path (in the caller repo checkout) to the YAML allowlist config"
    required: true
  dry_run:
    description: "When 'true' (default), logs what would be truncated without executing anything"
    required: false
    default: "true"
  slack_webhook_url:
    description: "Slack incoming webhook URL for success/failure notifications (pass via secrets in the caller workflow)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash
    - run: python ${{ github.action_path }}/scripts/truncate.py --config "${{ inputs.config_path }}"
      shell: bash
      env:
        DB_ENGINE: ${{ inputs.db_engine }}
        DB_HOST: ${{ inputs.db_host }}
        DB_PORT: ${{ inputs.db_port }}
        DB_NAME: ${{ inputs.db_name }}
        DB_USERNAME: ${{ inputs.db_username }}
        DB_PASSWORD: ${{ inputs.db_password }}
        DRY_RUN: ${{ inputs.dry_run }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
